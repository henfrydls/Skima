[package]
name = "skima"
version = "1.5.0"
description = "Skima - People Development Platform"
authors = ["DLSLabs"]
edition = "2024"

[lib]
name = "skima_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Store-copy WebView2 check (src/webview2.rs). Both are already in the tree through
# wry/tauri at these versions: webview2-com for the loader's own availability call,
# windows for a native message box before any event loop exists.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
