name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All four sidecars cross-compile from ONE Linux host with `bun build
  # --compile` (server/scripts/build-sidecars.mjs). The Prisma client is fully
  # Rust-free (WASM query compiler, no per-platform engines), which is what
  # makes this possible. This replaced @yao-pkg/pkg, whose macOS binaries had
  # to be prebuilt manually on a Mac (ICU abort on Tahoe) and could silently
  # ship without a Prisma engine — both bug classes are gone by construction,
  # and the macOS jobs below smoke-test DB access as a regression net.
  build-sidecar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pin Bun to the exact version validated for this flow. Bun has shipped
      # Mach-O signing regressions before — never float this.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Build all sidecars (linux, windows, darwin-x64, darwin-arm64)
        run: cd server && node scripts/build-sidecars.mjs

      # Quick functional check of the host-native binary: boots, applies the
      # schema, answers a Prisma-backed query.
      - name: Smoke test (linux binary)
        run: |
          ./src-tauri/binaries/skima-server-x86_64-unknown-linux-gnu --db-path /tmp/smoke.db --port 11999 > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 20); do
            grep -q "API running" /tmp/smoke.log && break
            sleep 1
          done
          cat /tmp/smoke.log
          grep -q "Database schema verified" /tmp/smoke.log
          curl -sf http://localhost:11999/api/config > /dev/null

      # Checksums travel with the binaries so every consumer can verify the
      # artifact roundtrip (upload-artifact once corrupted a large binary's
      # tail bytes in transit — never trust the transport).
      - name: Checksums
        run: |
          cd src-tauri/binaries
          sha256sum skima-server-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Sidecar Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sidecars
          path: |
            src-tauri/binaries/skima-server-*
            src-tauri/binaries/SHA256SUMS

  create-release:
    needs: build-sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release with changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Skima ${{ github.ref_name }}" \
            --generate-notes \
            --latest

  build-tauri:
    needs: [build-sidecar, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # macOS split into per-arch builds. We used to produce a single
          # --target universal-apple-darwin .dmg via `lipo -create` on the
          # Node sidecar, but the resulting universal binary crashed on
          # M-series Macs at v8::Isolate::Initialize. Each arch now ships
          # its own .dmg so the sidecar stays native to the host. Tauri's
          # latest.json auto-aggregator (aggregate-updater-json job below)
          # collates the darwin-aarch64 and darwin-x86_64 entries.
          #
          # We pin macos-26 (Tahoe) explicitly rather than macos-latest
          # because the .dmg has to be assembled with the same OS as the
          # sidecar so any ICU references the OS ships agree across the
          # bundle. macos-latest is still macos-15 (Sequoia) until the
          # 2026-06-15 → 2026-07-15 migration completes.
          - platform: macos-26
            args: '--target aarch64-apple-darwin'
            mac-arch: aarch64
          - platform: macos-26-intel
            args: '--target x86_64-apple-darwin'
            mac-arch: x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Each macOS job only needs its own Rust target.
          targets: ${{ matrix.mac-arch == 'aarch64' && 'aarch64-apple-darwin' || (matrix.mac-arch == 'x86_64' && 'x86_64-apple-darwin' || '') }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: |
          npm install
          cd client && npm install

      # All platforms take their sidecar from the single `sidecars` artifact.
      # The SHA256 check exists because the artifact zip roundtrip once
      # silently corrupted a large binary's tail bytes — verify, never trust.
      - name: Download Sidecars
        uses: actions/download-artifact@v4
        with:
          name: sidecars
          path: src-tauri/binaries/

      - name: Verify sidecar checksums
        if: matrix.platform != 'windows-latest'
        run: cd src-tauri/binaries && shasum -a 256 -c SHA256SUMS && rm SHA256SUMS

      - name: Verify sidecar checksums (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd src-tauri/binaries
          $failed = $false
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $expected = $parts[0]; $file = $parts[1].TrimStart('*')
            $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($actual -ne $expected) { Write-Error "CHECKSUM MISMATCH: $file"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Remove-Item SHA256SUMS

      - name: Make Sidecar Executable
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/skima-server-*

      # Bun's cross-compiled Mach-O signature can trip Gatekeeper variants and
      # Bun has shipped signing regressions before — re-sign ad-hoc on the
      # runner as belt-and-suspenders before Tauri bundles it.
      - name: Re-sign sidecar ad-hoc (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          BIN="src-tauri/binaries/skima-server-$([ "${{ matrix.mac-arch }}" = "aarch64" ] && echo aarch64 || echo x86_64)-apple-darwin"
          codesign --remove-signature "$BIN" 2>/dev/null || true
          codesign -s - -f "$BIN"
          codesign -v "$BIN"

      # Hard smoke test on the real macOS runner: the sidecar must boot AND
      # open the database. This catches BOTH historic silent-failure classes —
      # an ICU-style abort (no output) and a binary that serves "API running"
      # while unable to touch the DB (the v1.4.x Intel-engine bug).
      - name: Smoke test sidecar (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          BIN="src-tauri/binaries/skima-server-$([ "${{ matrix.mac-arch }}" = "aarch64" ] && echo aarch64 || echo x86_64)-apple-darwin"
          "$BIN" --db-path /tmp/smoke.db --port 11999 > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 20); do
            grep -q "API running" /tmp/smoke.log && break
            sleep 1
          done
          cat /tmp/smoke.log
          grep -q "Database schema verified" /tmp/smoke.log
          curl -sf http://localhost:11999/api/config > /dev/null

      # src-tauri/resources/ is now always present (Assets.car is committed),
      # so we no longer need a "mkdir -p" pre-step. The previous step used
      # bash's `mkdir -p` which fails on the Windows runner's PowerShell.

      # macOS 26 (Tahoe) wraps any app whose bundle lacks a modern Asset
      # Catalog (Assets.car keyed by CFBundleIconName) in a gray "squircle
      # jail" container. The catalog is shipped pre-compiled in
      # src-tauri/resources/Assets.car (built locally via
      # scripts/build-macos.sh from src-tauri/icons/Skima.icon) because
      # the macos-latest runners still use Xcode <26 — actool there does
      # not produce a usable .car for the .icon source format. Tauri
      # picks the catalog up via bundle.resources ("resources/*") and
      # merges src-tauri/Info.plist (CFBundleIconName=Skima) into the
      # final Info.plist before signing.
      #
      # When GitHub adds a macos-26 runner with Xcode 26+, we can drop
      # the committed Assets.car and reintroduce the `xcrun actool ...`
      # step here. Tracking issue: see repo issues for "macos-26 runner".

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — produces .sig files and the latest.json manifest
          # the auto-updater reads at runtime. Without these the bundle is unsigned
          # and existing v1.4.0+ clients will refuse the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NOTE on macOS code signing: Apple Developer Program enrollment is
          # deferred (see issue #54). The .app bundle is built with ad-hoc
          # signing (signingIdentity: "-" in tauri.macos.conf.json) so the
          # bundler succeeds without a real cert. Result: users still see
          # Gatekeeper warning on first launch and apply the documented
          # workaround. When Apple secrets are added, remove the "-" identity
          # and add the 6 APPLE_* env vars below the GITHUB_TOKEN line.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Skima ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: false
          # Tags shaped vX.Y.Z-rc.N (or -beta.N, -alpha.N) are published as
          # GitHub prereleases so they do not show up under /releases/latest/
          # and existing v1.4.0 users are not auto-prompted to "upgrade" to
          # an RC. Plain semver tags (vX.Y.Z) continue to publish as normal.
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Validate latest.json after all matrix jobs complete (issue #51).
  # tauri-action's per-platform uploads can leave the manifest with a partial
  # set of platforms if a job's updater artifact step silently skipped (e.g.
  # macOS before bundle.targets included "app"). This job audits the final
  # manifest and re-publishes it with a fresh pub_date as the canonical
  # "release fully aggregated" signal. Runs even if some build-tauri jobs
  # fail so partial-but-functional manifests still get the audit trail.
  # Ensure -rc., -beta., -alpha. tags publish as GitHub prereleases.
  # tauri-action accepts an explicit `prerelease` input but as of v0.5.x
  # has occasionally landed in `false` even when the input evaluates to
  # `true` (template-rendered booleans don't always survive the action's
  # internal type coercion). This step re-asserts the flag once after all
  # build matrix jobs have either succeeded or failed, so the prerelease
  # state is correct regardless of which platforms actually published.
  set-prerelease-flag:
    needs: [build-tauri]
    if: always() && (contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.'))
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --prerelease --repo "${{ github.repository }}"

  aggregate-updater-json:
    needs: [build-tauri]
    if: always() && needs.build-tauri.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aggregate and validate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/aggregate-updater-json.js
