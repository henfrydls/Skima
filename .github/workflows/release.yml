name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All four sidecars cross-compile from ONE Linux host with `bun build
  # --compile` (server/scripts/build-sidecars.mjs). The Prisma client is fully
  # Rust-free (WASM query compiler, no per-platform engines), which is what
  # makes this possible. This replaced @yao-pkg/pkg, whose macOS binaries had
  # to be prebuilt manually on a Mac (ICU abort on Tahoe) and could silently
  # ship without a Prisma engine — both bug classes are gone by construction,
  # and the macOS jobs below smoke-test DB access as a regression net.
  build-sidecar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pin Bun to the exact version validated for this flow. Bun has shipped
      # Mach-O signing regressions before — never float this.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Build all sidecars (linux, windows, darwin-x64, darwin-arm64)
        run: cd server && node scripts/build-sidecars.mjs

      # Functional check of the host-native binary: boots, applies the schema,
      # and completes a WRITE round-trip (covers datetime + boolean coercion
      # through the bun:sqlite adapter, not just a read).
      # Runs from an empty temp dir ON PURPOSE: the client's WASM disk-fallback
      # resolves relative to cwd, so running from the repo could mask a
      # non-embedded WASM. Isolation must be explicit, not incidental.
      - name: Smoke test (linux binary)
        run: |
          BIN="$GITHUB_WORKSPACE/src-tauri/binaries/skima-server-x86_64-unknown-linux-gnu"
          cd "$(mktemp -d)"
          "$BIN" --db-path ./smoke.db --port 11999 > ./smoke.log 2>&1 &
          SIDECAR_PID=$!
          trap 'kill $SIDECAR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            grep -q "API running" ./smoke.log && break
            sleep 1
          done
          cat ./smoke.log
          grep -q "Database schema verified" ./smoke.log
          curl -sf http://localhost:11999/api/config | grep -q '"isSetup":false'
          curl -sf -X POST http://localhost:11999/api/setup -H 'Content-Type: application/json' \
            -d '{"companyName":"CI Smoke","adminName":"CI"}' > /dev/null
          curl -sf http://localhost:11999/api/config | grep -q '"isSetup":true'
          # DATE ROUND-TRIP: rc.4 shipped a sidecar whose DateTime READS were
          # all null (exports lost every date) while boot + writes looked
          # healthy. Write a collaborator (joinedAt = now) and require the API
          # to return it as an ISO date.
          curl -sf -X POST http://localhost:11999/api/collaborators -H 'Content-Type: application/json' \
            -d '{"nombre":"DateCheck","rol":"CI"}' > /dev/null
          curl -sf http://localhost:11999/api/collaborators | grep -qE '"joinedAt":"20[0-9]{2}-'

      # Checksums travel with the binaries so every consumer can verify the
      # artifact roundtrip (upload-artifact once corrupted a large binary's
      # tail bytes in transit — never trust the transport).
      - name: Checksums
        run: |
          cd src-tauri/binaries
          sha256sum skima-server-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Sidecar Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sidecars
          path: |
            src-tauri/binaries/skima-server-*
            src-tauri/binaries/SHA256SUMS

  create-release:
    needs: build-sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release with changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Prerelease tags (-rc./-beta./-alpha.) must be born as prereleases:
        # /releases/latest/download/latest.json is the live updater endpoint,
        # and an RC marked --latest — even for the build window until
        # set-prerelease-flag runs — could serve v1.4.x users a partial RC
        # manifest. The `gh release view ||` guard makes workflow re-runs
        # idempotent instead of failing on "release already exists".
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ -(rc|beta|alpha)\. ]]; then FLAG="--prerelease"; else FLAG="--latest"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Skima $TAG" \
            --generate-notes \
            "$FLAG"

  build-tauri:
    needs: [build-sidecar, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # macOS split into per-arch builds. We used to produce a single
          # --target universal-apple-darwin .dmg via `lipo -create` on the
          # Node sidecar, but the resulting universal binary crashed on
          # M-series Macs at v8::Isolate::Initialize. Each arch now ships
          # its own .dmg so the sidecar stays native to the host. Tauri's
          # latest.json auto-aggregator (aggregate-updater-json job below)
          # collates the darwin-aarch64 and darwin-x86_64 entries.
          #
          # We pin macos-26 (Tahoe) explicitly rather than macos-latest
          # because the .dmg has to be assembled with the same OS as the
          # sidecar so any ICU references the OS ships agree across the
          # bundle. macos-latest is still macos-15 (Sequoia) until the
          # 2026-06-15 → 2026-07-15 migration completes.
          - platform: macos-26
            args: '--target aarch64-apple-darwin'
            mac-arch: aarch64
          - platform: macos-26-intel
            args: '--target x86_64-apple-darwin'
            mac-arch: x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: |
          npm install
          cd client && npm install

      # All platforms take their sidecar from the single `sidecars` artifact.
      # The SHA256 check exists because the artifact zip roundtrip once
      # silently corrupted a large binary's tail bytes — verify, never trust.
      - name: Download Sidecars
        uses: actions/download-artifact@v4
        with:
          name: sidecars
          path: src-tauri/binaries/

      - name: Verify sidecar checksums
        if: matrix.platform != 'windows-latest'
        run: cd src-tauri/binaries && shasum -a 256 -c SHA256SUMS && rm SHA256SUMS

      - name: Verify sidecar checksums (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cd src-tauri/binaries
          $failed = $false
          Get-Content SHA256SUMS | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $expected = $parts[0]; $file = $parts[1].TrimStart('*')
            $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($actual -ne $expected) { Write-Error "CHECKSUM MISMATCH: $file"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Remove-Item SHA256SUMS

      # Windows is the one target nobody boots outside CI — same hard smoke
      # test as macOS: boot + schema verified + a write round-trip, from an
      # isolated temp dir so a non-embedded WASM cannot be masked by disk files.
      - name: Smoke test sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'src-tauri/binaries/skima-server-x86_64-pc-windows-msvc.exe'
          $work = Join-Path $env:RUNNER_TEMP 'sidecar-smoke'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          $p = Start-Process -FilePath $bin -ArgumentList '--db-path', "$work\smoke.db", '--port', '11999' `
            -RedirectStandardOutput "$work\smoke.log" -RedirectStandardError "$work\smoke.err" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 1
              if ((Get-Content "$work\smoke.log" -Raw -ErrorAction SilentlyContinue) -match 'API running') { $ok = $true; break }
            }
            Get-Content "$work\smoke.log" -ErrorAction SilentlyContinue
            Get-Content "$work\smoke.err" -ErrorAction SilentlyContinue
            if (-not $ok) { throw 'sidecar never reported API running' }
            if ((Get-Content "$work\smoke.log" -Raw) -notmatch 'Database schema verified') { throw 'schema not verified' }
            $cfg = Invoke-RestMethod http://localhost:11999/api/config
            if ($cfg.isSetup -ne $false) { throw 'unexpected initial isSetup' }
            Invoke-RestMethod -Method Post -Uri http://localhost:11999/api/setup `
              -ContentType 'application/json' -Body '{"companyName":"CI Smoke","adminName":"CI"}' | Out-Null
            $cfg2 = Invoke-RestMethod http://localhost:11999/api/config
            if ($cfg2.isSetup -ne $true) { throw 'setup write round-trip failed' }
            # DATE ROUND-TRIP (rc.4: all DateTime READS were null while boot +
            # writes looked healthy): write a collaborator, require an ISO date back.
            # Match the RAW JSON (like the bash smokes' grep) — Invoke-RestMethod
            # auto-coerces ISO strings into [datetime] objects, which stringify
            # in locale format and false-failed this check on rc.5.
            Invoke-RestMethod -Method Post -Uri http://localhost:11999/api/collaborators `
              -ContentType 'application/json' -Body '{"nombre":"DateCheck","rol":"CI"}' | Out-Null
            $raw = (Invoke-WebRequest -UseBasicParsing http://localhost:11999/api/collaborators).Content
            if ($raw -notmatch '"joinedAt":"20\d{2}-') {
              Write-Host "RAW RESPONSE: $raw"
              throw 'DateTime read round-trip failed (joinedAt not an ISO string in the JSON)'
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Make Sidecar Executable
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/skima-server-*

      # Bun's cross-compiled Mach-O signature can trip Gatekeeper variants and
      # Bun has shipped signing regressions before — re-sign ad-hoc on the
      # runner as belt-and-suspenders before Tauri bundles it.
      - name: Re-sign sidecar ad-hoc (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          BIN="src-tauri/binaries/skima-server-${{ matrix.mac-arch }}-apple-darwin"
          codesign --remove-signature "$BIN" 2>/dev/null || true
          codesign -s - -f "$BIN"
          codesign -v "$BIN"

      # Hard smoke test on the real macOS runner: the sidecar must boot AND
      # open the database. This catches BOTH historic silent-failure classes —
      # an ICU-style abort (no output) and a binary that serves "API running"
      # while unable to touch the DB (the v1.4.x Intel-engine bug).
      - name: Smoke test sidecar (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          BIN="$PWD/src-tauri/binaries/skima-server-${{ matrix.mac-arch }}-apple-darwin"
          cd "$(mktemp -d)"
          "$BIN" --db-path ./smoke.db --port 11999 > ./smoke.log 2>&1 &
          SIDECAR_PID=$!
          trap 'kill $SIDECAR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            grep -q "API running" ./smoke.log && break
            sleep 1
          done
          cat ./smoke.log
          grep -q "Database schema verified" ./smoke.log
          curl -sf http://localhost:11999/api/config | grep -q '"isSetup":false'
          curl -sf -X POST http://localhost:11999/api/setup -H 'Content-Type: application/json' \
            -d '{"companyName":"CI Smoke","adminName":"CI"}' > /dev/null
          curl -sf http://localhost:11999/api/config | grep -q '"isSetup":true'
          # DATE ROUND-TRIP: rc.4 shipped a sidecar whose DateTime READS were
          # all null (exports lost every date) while boot + writes looked
          # healthy. Write a collaborator (joinedAt = now) and require the API
          # to return it as an ISO date.
          curl -sf -X POST http://localhost:11999/api/collaborators -H 'Content-Type: application/json' \
            -d '{"nombre":"DateCheck","rol":"CI"}' > /dev/null
          curl -sf http://localhost:11999/api/collaborators | grep -qE '"joinedAt":"20[0-9]{2}-'

      # src-tauri/resources/ is now always present (Assets.car is committed),
      # so we no longer need a "mkdir -p" pre-step. The previous step used
      # bash's `mkdir -p` which fails on the Windows runner's PowerShell.

      # macOS 26 (Tahoe) wraps any app whose bundle lacks a modern Asset
      # Catalog (Assets.car keyed by CFBundleIconName) in a gray "squircle
      # jail" container. The catalog is shipped pre-compiled in
      # src-tauri/resources/Assets.car (built locally via
      # scripts/build-macos.sh from src-tauri/icons/Skima.icon) because
      # the macos-latest runners still use Xcode <26 — actool there does
      # not produce a usable .car for the .icon source format. Tauri
      # picks the catalog up via bundle.resources ("resources/*") and
      # merges src-tauri/Info.plist (CFBundleIconName=Skima) into the
      # final Info.plist before signing.
      #
      # When GitHub adds a macos-26 runner with Xcode 26+, we can drop
      # the committed Assets.car and reintroduce the `xcrun actool ...`
      # step here. Tracking issue: see repo issues for "macos-26 runner".

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — produces .sig files and the latest.json manifest
          # the auto-updater reads at runtime. Without these the bundle is unsigned
          # and existing v1.4.0+ clients will refuse the update.
          # linuxdeploy strips every binary in the AppDir by default, and strip
          # DESTROYS a Bun standalone sidecar: it drops the bunfs trailer, strip
          # exits 0, and the binary dies at runtime with "Module not found"
          # (verified locally at v1.5.0-rc.1 — the AppImage bundling also failed
          # outright with `failed to run linuxdeploy`). Cost: a larger AppImage.
          NO_STRIP: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NOTE on macOS code signing: Apple Developer Program enrollment is
          # deferred (see issue #54). The .app bundle is built with ad-hoc
          # signing (signingIdentity: "-" in tauri.macos.conf.json) so the
          # bundler succeeds without a real cert. Result: users still see
          # Gatekeeper warning on first launch and apply the documented
          # workaround. When Apple secrets are added, remove the "-" identity
          # and add the 6 APPLE_* env vars below the GITHUB_TOKEN line.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Skima ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: false
          # Tags shaped vX.Y.Z-rc.N (or -beta.N, -alpha.N) are published as
          # GitHub prereleases so they do not show up under /releases/latest/
          # and existing v1.4.0 users are not auto-prompted to "upgrade" to
          # an RC. Plain semver tags (vX.Y.Z) continue to publish as normal.
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Validate latest.json after all matrix jobs complete (issue #51).
  # tauri-action's per-platform uploads can leave the manifest with a partial
  # set of platforms if a job's updater artifact step silently skipped (e.g.
  # macOS before bundle.targets included "app"). This job audits the final
  # manifest and re-publishes it with a fresh pub_date as the canonical
  # "release fully aggregated" signal. Runs even if some build-tauri jobs
  # fail so partial-but-functional manifests still get the audit trail.
  # Ensure -rc., -beta., -alpha. tags publish as GitHub prereleases.
  # tauri-action accepts an explicit `prerelease` input but as of v0.5.x
  # has occasionally landed in `false` even when the input evaluates to
  # `true` (template-rendered booleans don't always survive the action's
  # internal type coercion). This step re-asserts the flag once after all
  # build matrix jobs have either succeeded or failed, so the prerelease
  # state is correct regardless of which platforms actually published.
  set-prerelease-flag:
    needs: [build-tauri]
    if: always() && (contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.'))
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --prerelease --repo "${{ github.repository }}"

  aggregate-updater-json:
    needs: [build-tauri]
    if: always() && needs.build-tauri.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aggregate and validate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/aggregate-updater-json.js
