name: Quality Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Client Dependencies
        run: cd client && npm install

      - name: Install Server Dependencies
        run: cd server && npm install
        shell: bash

      # Linting
      - name: Lint Client
        run: npx eslint src/
        working-directory: ./client

      # Tests with Coverage
      - name: Run Client Tests with Coverage
        run: npx vitest run --coverage
        working-directory: ./client

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./server

      - name: Setup Server Test Database
        run: npx prisma db push --skip-generate
        working-directory: ./server
        env:
          DATABASE_URL: file:./prisma/test.db

      - name: Run Server Tests with Coverage
        run: npx vitest run --coverage
        working-directory: ./server
        env:
          DATABASE_URL: file:./prisma/test.db
          SKIMA_DISABLE_CHECKIN: '1'

      # Release tooling (scripts/): plain Node, OS-independent, so once is enough.
      - name: Run Release Script Tests
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:scripts

      # Build Check
      - name: Build Client
        run: npm run build
        working-directory: ./client

      # The Windows-only Rust (cfg(target_os = "windows")) is compiled nowhere
      # else before a tag: Linux and macOS skip it, and release.yml is the first
      # Windows build. Needs client/dist (above) and a placeholder sidecar for
      # tauri-build's externalBin check.
      - name: Install Rust (Windows)
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (Windows)
        if: matrix.os == 'windows-latest'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Rust tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType File -Force src-tauri/binaries/skima-server-x86_64-pc-windows-msvc.exe | Out-Null
          cd src-tauri
          cargo test --lib

      # Upload Coverage Artifacts (only from Ubuntu to avoid duplicates)
      - name: Upload Client Coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/

      - name: Upload Server Coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/

      # Security Audit (only from Ubuntu to avoid duplicates)
      - name: Security Audit (Root)
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Security Audit (Client)
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
        working-directory: ./client
        continue-on-error: true

      - name: Security Audit (Server)
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
        working-directory: ./server
        continue-on-error: true

  # Builds the linux sidecar exactly as release.yml will, so generator-contract
  # breakage (e.g. a prisma bump changing the generated WASM-loader shape that
  # scripts/build-sidecars.mjs patches) fails on the dependency PR — not on
  # release day when the tag is pushed. ~3 minutes.
  sidecar-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Same pin as release.yml — keep them in sync.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Server Dependencies
        run: cd server && npm ci

      # Same injection path as release.yml, with values under .invalid
      # (RFC 2606: never resolves), so it is exercised on every PR.
      - name: Build linux sidecar
        env:
          CHECKIN_URL: http://checkin.invalid/api/send
          CHECKIN_WEBSITE_ID: 00000000-0000-0000-0000-000000000000
        run: cd server && node scripts/build-sidecars.mjs linux

      - name: Source left clean after injection
        run: |
          git diff --exit-code -- server/src/checkin.js
          ! grep -q 'checkin.invalid' server/src/checkin.js

      # Isolated on purpose: the WASM disk-fallback resolves relative to cwd,
      # so running from the repo could mask a non-embedded WASM.
      - name: Smoke test (isolated)
        env:
          SKIMA_DISABLE_CHECKIN: '1'
        run: |
          BIN="$GITHUB_WORKSPACE/src-tauri/binaries/skima-server-x86_64-unknown-linux-gnu"
          cd "$(mktemp -d)"
          "$BIN" --db-path ./smoke.db --port 11999 > ./smoke.log 2>&1 &
          SIDECAR_PID=$!
          trap 'kill $SIDECAR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            grep -q "API running" ./smoke.log && break
            sleep 1
          done
          cat ./smoke.log
          grep -q "Database schema verified" ./smoke.log
          curl -sf http://127.0.0.1:11999/api/config | grep -q '"isSetup":false'
          curl -sf -X POST http://127.0.0.1:11999/api/setup -H 'X-Skima: 1' -H 'Content-Type: application/json' \
            -d '{"companyName":"CI Smoke","adminName":"CI"}' > /dev/null
          curl -sf http://127.0.0.1:11999/api/config | grep -q '"isSetup":true'
          # DATE ROUND-TRIP: rc.4 shipped a sidecar whose DateTime READS were
          # all null (exports lost every date) while boot + writes looked
          # healthy. Write a collaborator (joinedAt = now) and require the API
          # to return it as an ISO date.
          curl -sf -X POST http://127.0.0.1:11999/api/collaborators -H 'X-Skima: 1' -H 'Content-Type: application/json' \
            -d '{"nombre":"DateCheck","rol":"CI"}' > /dev/null
          curl -sf http://127.0.0.1:11999/api/collaborators | grep -qE '"joinedAt":"20[0-9]{2}-'
          # CROSS-SITE GUARD: a write without the API header is refused (403).
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:11999/api/collaborators \
            -H 'Content-Type: application/json' -d '{"nombre":"NoHeader","rol":"CI"}')
          [ "$CODE" = "403" ] || { echo "::error::POST without X-Skima returned $CODE, not 403"; exit 1; }
          # LOOPBACK ONLY: the API has no password, so it must not answer on the network.
          LAN=$(hostname -I | awk '{print $1}')
          if [ -n "$LAN" ] && curl -s -o /dev/null --max-time 3 "http://$LAN:11999/api/config"; then
            echo "::error::the sidecar answers on $LAN, not only on loopback"; exit 1
          fi
          # CHECK-IN: version must be real (not "unknown"), disabled gate must hold
          STATUS=$(curl -sf http://127.0.0.1:11999/api/checkin-status)
          echo "checkin-status: $STATUS"
          echo "$STATUS" | grep -q '"disabled":true'
          echo "$STATUS" | grep -q '"version":"[0-9]'
          echo "$STATUS" | grep -q '"configured":true'

  # The installer hooks (src-tauri/windows/hooks.nsh) stop a sidecar left running by a
  # killed Skima.exe, which otherwise locks skima-server.exe and makes installing over it
  # fail. This runs them in a small test installer, without building the app.
  nsis-hooks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer hooks stop a running sidecar
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          if (-not (Test-Path $makensis)) { throw 'makensis not found' }
          $work = Join-Path $env:RUNNER_TEMP 'nsis-hooks'
          $inst = Join-Path $work 'Skima'
          $other = Join-Path $work 'Other'
          New-Item -ItemType Directory -Force $inst, $other | Out-Null

          # Exit code of a test installer run while a stand-in sidecar holds the file.
          # The stand-in is ping, renamed: it keeps running and keeps its file locked.
          # A second copy outside the install folder must be left alone.
          function Invoke-Case([string]$kind, [string[]]$defines) {
            $exe = Join-Path $work "hooks-$kind.exe"
            & $makensis /V2 "/DOUTFILE=$exe" @defines src-tauri\windows\hooks-test.nsi | Out-Host
            if ($LASTEXITCODE) { throw "makensis failed ($kind)" }
            Copy-Item "$env:SystemRoot\System32\PING.EXE" "$inst\skima-server.exe" -Force
            Copy-Item "$env:SystemRoot\System32\PING.EXE" "$other\skima-server.exe" -Force
            $target = Start-Process "$inst\skima-server.exe" -ArgumentList '-t', '127.0.0.1' -WindowStyle Hidden -PassThru
            $decoy = Start-Process "$other\skima-server.exe" -ArgumentList '-t', '127.0.0.1' -WindowStyle Hidden -PassThru
            try {
              $run = Start-Process $exe -ArgumentList '/S', "/D=$inst" -Wait -PassThru
              Write-Host "$kind -> exit $($run.ExitCode), sidecar stopped: $($target.HasExited), other copy stopped: $($decoy.HasExited)"
              if ($decoy.HasExited) { throw "$kind stopped a skima-server.exe outside the install folder" }
              return @{ Exit = $run.ExitCode; Stopped = $target.HasExited }
            } finally {
              Stop-Process -Id $target.Id, $decoy.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 1
            }
          }

          $none = Invoke-Case 'nohook' @('/DNOHOOK')
          if ($none.Exit -ne 3) { throw 'without the hook the file should stay locked: the test proves nothing' }
          foreach ($kind in 'install', 'uninstall') {
            $defines = if ($kind -eq 'uninstall') { @('/DUNINSTALL') } else { @() }
            $r = Invoke-Case $kind $defines
            if (-not $r.Stopped) { throw "$kind hook did not stop the sidecar in the install folder" }
            if ($r.Exit -ne 0) { throw "$kind hook left skima-server.exe locked (exit $($r.Exit))" }
          }

          # Nothing running and no file: the hook must not fail.
          Remove-Item "$inst\skima-server.exe" -Force
          $run = Start-Process (Join-Path $work 'hooks-install.exe') -ArgumentList '/S', "/D=$inst" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the hook failed with nothing to stop (exit $($run.ExitCode))" }
