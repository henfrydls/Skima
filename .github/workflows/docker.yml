name: Docker

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  # PRs build and smoke the image with fake check-in values and never push,
  # so this workflow is exercised before the first tag.
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'server/**'
      - 'client/**'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Forks have no secrets: the official image is only built in the upstream repo.
    # (On a pull_request this checks the base repo, so fork PRs still get the
    # no-secrets build + smoke below.)
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    env:
      # PR runs use values under .invalid (RFC 2606: never resolves) and never
      # push; tag and manual runs use the real secrets.
      CHECKIN_URL: ${{ github.event_name == 'pull_request' && 'http://checkin.invalid/api/send' || secrets.CHECKIN_URL }}
      CHECKIN_WEBSITE_ID: ${{ github.event_name == 'pull_request' && '00000000-0000-0000-0000-000000000000' || secrets.CHECKIN_WEBSITE_ID }}
    steps:
      # An image without the check-in values would ship silently uncounted.
      - name: Require check-in values
        run: |
          [ -n "$CHECKIN_URL" ] || { echo "::error::secret CHECKIN_URL is empty"; exit 1; }
          [ -n "$CHECKIN_WEBSITE_ID" ] || { echo "::error::secret CHECKIN_WEBSITE_ID is empty"; exit 1; }

      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local daemon for the smoke test; the push step
      # below reuses the same layers from the buildx cache.
      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: skima-smoke:ci
          build-args: |
            CHECKIN_URL=${{ env.CHECKIN_URL }}
            CHECKIN_WEBSITE_ID=${{ env.CHECKIN_WEBSITE_ID }}
            SKIMA_VERSION=${{ steps.version.outputs.version }}
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test image
        run: |
          docker run -d --name skima-smoke -p 13001:3001 -e SKIMA_DISABLE_CHECKIN=1 skima-smoke:ci
          trap 'docker logs skima-smoke; docker rm -f skima-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            curl -sf http://localhost:13001/api/config > /dev/null && break
            sleep 1
          done
          STATUS=$(curl -sf http://localhost:13001/api/checkin-status)
          echo "checkin-status: $STATUS"
          echo "$STATUS" | grep -q '"disabled":true'
          echo "$STATUS" | grep -q '"configured":true'
          echo "$STATUS" | grep -qF '"version":"${{ steps.version.outputs.version }}"'
          docker exec skima-smoke printenv DOCKER | grep -qx true

      # The online demo runs this image with DEMO_MODE=true: the entrypoint seeds it
      # through the API, so a seed refused by the cross-site guard leaves it empty.
      - name: Smoke test demo mode
        run: |
          docker run -d --name skima-demo-smoke -p 13002:3001 -e SKIMA_DISABLE_CHECKIN=1 -e DEMO_MODE=true skima-smoke:ci
          trap 'docker logs skima-demo-smoke; docker rm -f skima-demo-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            docker logs skima-demo-smoke 2>&1 | grep -q "Skima is ready" && break
            sleep 1
          done
          CONFIG=$(curl -sf http://localhost:13002/api/config)
          echo "config: $CONFIG"
          echo "$CONFIG" | grep -q '"isSetup":true'
          curl -sf http://localhost:13002/api/collaborators | grep -q '"nombre"'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:13002/api/seed-demo)
          [ "$CODE" = "403" ] || { echo "::error::POST without X-Skima returned $CODE, not 403"; exit 1; }

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Lets a manual workflow_dispatch on a feature branch produce a
            # throwaway tag (= branch name) so the image build/push path can be
            # exercised without cutting a release tag.
            type=ref,event=branch

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHECKIN_URL=${{ env.CHECKIN_URL }}
            CHECKIN_WEBSITE_ID=${{ env.CHECKIN_WEBSITE_ID }}
            SKIMA_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          # GHCR rejects the SLSA provenance attestation manifest that buildx
          # attaches by default ("ERROR: unknown blob" on push), especially
          # after a package version has been deleted and its blobs are pending
          # garbage collection. We don't consume the attestation anywhere, so
          # disable it to keep pushes deterministic.
          provenance: false
